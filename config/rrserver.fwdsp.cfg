[fwdsp]
path=/usr/bin/fwdsp
; Don't allow more than 24 subprocs
subproc.max=24
hangtime=5
log.audio=false
pcm-hub=true
recording.path=/var/lib/rustyrig/recordings
recording.tx=true
recording.rx=false
recording.buffer-size=524288
; Voice TX uses Ogg/Vorbis; DU/DL and FT4/FT8 TX use FLAC.
recording.codec=ogg
recording.codec.modem=flac
log.level=info
;log.show-ts=false
log.file=/var/log/rustyrig/fwdsp-srv.log
