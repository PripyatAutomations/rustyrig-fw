; Platform / distro-specific settings belong here rather than in rrserver.cfg.
; Kept as a separate include so upgrades can add defaults without forcing
; a review of the complete server configuration.
;
; Linux package accounts/groups:
;   rustyrig  - private service account and package-owned files
;   rradmin   - trusted local administrative access
;   rruser    - local access to client-created virtual serial PTYs
;
; Debian package maintainer scripts provision these groups and ask which
; existing users should join rruser; no permissions are granted here.
[general]
