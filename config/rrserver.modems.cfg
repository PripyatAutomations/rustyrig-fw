; Optional external modem workers attached to local rigs.
; Workers are server-owned, not client-side. See doc/dsp-workers.md,
; doc/TODO-MODEM and modems/ft8/README.md.
;
; Modem executable directory (default: /usr/libexec/rustyrig/modems)
;[general]
;modem.path=/usr/libexec/rustyrig/modems
;
; FT8 receive-only worker for rig0. Build/install rrmodem-ft8 and its
; kgoba/ft8_lib dependency before uncommenting the export.
; This serial subprocess bridge emits decoded FT8 JSON lines, or RAW
; followed by newline for plain text. TX is not supported.
[serial]
;ttyMODEM0=modem:/usr/libexec/rustyrig/modems/rrmodem-ft8
;
; Example second rig with an external worker:
;ttyMODEM1=modem:/usr/libexec/rustyrig/modems/rrmodem-psk BPSK31 1500
;ttyMODEM2=modem:/usr/libexec/rustyrig/modems/rrmodem-olivia 8 500
; PSK/Olivia are receive-only prototypes. Build: make -C modems
; They require a rig binding for each export, e.g.:
;[serial:ttyMODEM1]
;rig=rig0
;[serial:ttyMODEM2]
;rig=rig0
;
;[serial:ttyMODEM0]
;rig=rig0
;log=/var/log/rustyrig/ttyMODEM0.log
;buffer-bytes=16384
;
; Log directory must be writable by rrserver; rotate logs.
; Traffic log rows: unix_seconds TAB username TAB session_fingerprint
; TAB TX|RX TAB hex. Fingerprint is not an authentication token.
;
; Worker FDs: 0/1 serial bytes, 2 stderr, 3 SOCK_SEQPACKET control,
; 4 rig RX PCM input, 5 rig TX PCM output.
; RX PCM wiring is experimental. Control, PTT leases, TX injection and
; negotiated PCM/packet framing are not yet implemented.
;
; An exported ttyMODEM0 requires serial or serial.ttyMODEM0 privilege.
; Keep disabled until an executable is installed to avoid a dead export.
