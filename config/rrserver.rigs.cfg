[general]
rig.instances=rig0 rig1

[rig:rig0]
; Fixed rig: optionally override the server's City, State, Country.
;location=Ripley, West Virginia, United States
; Mobile rig: uncomment the following setting instead. It advertises
; location=MOBILE, regardless of the fixed server or rig location.
;mobile=true
; Rig position override (decimal degrees). This disables this rig's GPS input.
;gps.position=37.654321,-81.234567
name=rig0
backend=internal
; Optional: room=#my-hamlib-radio
; Room must be #<station.name>-rigN; defaults to that canonical name.
; PCM endpoints default to src.<alias> and sink.<alias> in [pipelines].
; RX subrooms may tune only if changing a VFO never moves the shared LO.
;rx-independent-tuning=false
audio.source=src.pink
audio.sink=none
vfos=A B
; Install rustyrig-server-hamlib for backend=hamlib (loaded on demand).
hamlib.model=2
hamlib.baud=38400
hamlib.device=127.0.0.1:4532
; Seconds before reconnecting; 0 leaves non-default rigs offline, or exits
; for the default rig so a supervisor can restart it.
reconnect-interval=30

; Hamlib NET rigctl backend, connected to the local rigctld.
[rig:rig1]
name=rig1
backend=hamlib
;audio.source=src.rig1
;audio.sink=sink.rig1
vfos=A B
state-interval=15
hamlib.model=2
hamlib.device=127.0.0.1:4532
reconnect-interval=30

[pipelines]
; Rig audio interfaces use PulseAudio, which also works with PipeWire's
; PulseAudio compatibility service. Set device= to a specific host source or
; sink when the default device is not connected to the rig.
src.rig0=pulsesrc name=processor-rig-rx device=default client-name=rrserver-rig-rx do-timestamp=true ! \
        audioconvert ! audioresample ! audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
        queue max-size-buffers=8 max-size-time=100000000 leaky=downstream ! \
        appsink name=processor-sink emit-signals=false sync=false max-buffers=5 drop=true

sink.rig0=appsrc name=processor-src is-live=true format=time do-timestamp=true caps=audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
        queue max-size-buffers=8 max-size-time=100000000 leaky=downstream ! volume name=processor-vol ! \
        audioconvert ! audioresample ! audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
        vorbisenc name=rr-encoder quality=0.3 ! oggmux ! filesink location=/var/lib/rustyrig/recordings/rig-tx.ogg
