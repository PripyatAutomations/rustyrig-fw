#############
# TUI Theme #
#############
; Should these just be a single color we lookup OR a full string with {name} or {#hex} style colors for 256 color?
theme.bgcolor={black}
theme.normal={white}
theme.chans={magenta}
theme.clock.digit={cyan}
theme.clock.separator={bright-black}
theme.nicks={bright-cyan}
theme.msg.connected={bright-green}
theme.msg.offline={red}
theme.status={reset}Status: {light-green}${online}{reset} {bright-black}[{bright-cyan}${win.title}{bright-black}]
tui.keymap.prev-win=Alt-Left
tui.keymap.next-win=Alt-Right
tui.keymap.ptt=Ctrl-Space
tui.keymap.del-word=Ctrl-W
tui.keymap.del-line=Ctrl-U
tui.keymap.scroll-up=Pgup
tui.keymap.scroll-down=Pgdn

# Font aliases defined here are exposed to the GUI
;ui.fonts = system, mono, headings, chat

# Alias -> actual font definition (Pango format)
;ui.font.system=Sans 12
;ui.font.mono=Monospace 13
;ui.font.headings=Sans Bold 14
;ui.font.chat=Monospace 11
ui.font.buttons=Sans 14

[gtk-css]
.ptt-active   { background: #b00000; color: white; font-weight: bold; }
.ptt-idle     { background: #0a7a0a; color: white; font-weight: bold; }
.ptt-pending  { background: #e6c200; color: black; font-weight: bold; }
.ptt-offline  { background: #555555; color: white; font-weight: bold; }
.ptt-tot      { background: #e07000; color: black; font-weight: bold; }
.conn-active  { background: #0a7a0a; color: white; font-weight: bold; }
.conn-pending { background: #e6c200; color: black; font-weight: bold; }
.conn-idle    { background: #b00000; color: white; font-weight: bold; }

