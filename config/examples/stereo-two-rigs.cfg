; Reference fragment: split one stereo PulseAudio/PipeWire interface into
; two isolated mono rig inputs and two isolated mono rig outputs.
; Merge these sections into the appropriate rrserver rig/pipeline config.
; These are not defaults. Replace 'default' with the SAME actual source/sink
; device names for both rigs to ensure channel pairing stays deterministic.
; Requires GStreamer Good plugins: deinterleave, audiopanorama.
;
; LEFT channel (0) = rig0, RIGHT channel (1) = rig1.
; Each rig's network audio remains 16 kHz mono S16LE.
; Capture uses two independent PulseAudio source streams, each requesting
; the same stereo hardware device; fwdsp processes remain per rig.
; Playback uses two independent streams panned hard L/R and mixed by the
; sound server into one physical stereo sink.

[rig:rig0]
audio.source=src.stereo-left
audio.sink=sink.stereo-left

[rig:rig1]
audio.source=src.stereo-right
audio.sink=sink.stereo-right

[pipelines]
src.stereo-left=pulsesrc device=default client-name=rrserver-rig0-rx do-timestamp=true ! \
    audioconvert ! audio/x-raw,channels=2 ! deinterleave name=split \
    split.src_0 ! queue max-size-buffers=8 leaky=downstream ! audioconvert ! audioresample ! \
    audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
    appsink name=processor-sink emit-signals=false sync=false max-buffers=5 drop=true \
    split.src_1 ! queue ! fakesink sync=false

src.stereo-right=pulsesrc device=default client-name=rrserver-rig1-rx do-timestamp=true ! \
    audioconvert ! audio/x-raw,channels=2 ! deinterleave name=split \
    split.src_0 ! queue ! fakesink sync=false \
    split.src_1 ! queue max-size-buffers=8 leaky=downstream ! audioconvert ! audioresample ! \
    audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
    appsink name=processor-sink emit-signals=false sync=false max-buffers=5 drop=true

sink.stereo-left=appsrc name=processor-src is-live=true format=time do-timestamp=true \
    caps=audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
    queue max-size-buffers=8 leaky=downstream ! volume name=processor-vol ! \
    audioconvert ! audiopanorama method=simple panorama=-1.0 ! audioresample ! \
    pulsesink device=default client-name=rrserver-rig0-tx sync=false

sink.stereo-right=appsrc name=processor-src is-live=true format=time do-timestamp=true \
    caps=audio/x-raw,format=S16LE,rate=16000,channels=1,layout=interleaved ! \
    queue max-size-buffers=8 leaky=downstream ! volume name=processor-vol ! \
    audioconvert ! audiopanorama method=simple panorama=1.0 ! audioresample ! \
    pulsesink device=default client-name=rrserver-rig1-tx sync=false
