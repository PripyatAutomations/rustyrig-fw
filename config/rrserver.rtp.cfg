; Authenticated RTP audio. A random available UDP port is chosen at startup.
; Set host to the address native clients can reach (empty uses media.direct.host).
[rtp]
enabled=true
bind=0.0.0.0
host=
ports=8422-8499
acl=site
encrypt=false

; Additional pools may use different addresses, ranges and named ACLs.
; Disable [rtp] if only named pools should be offered.
;[rtp:other-site]
;enabled=false
;bind=0.0.0.0
;host=radio.example.net
;ports=8500-8599
;acl=site
;encrypt=false
