[general]
; Remote administration scope: true restricts remote-admin to directly linked
; peers (one hop). Set false to permit administration anywhere in the linked
; server tree, subject to destination-side privilege grants.
remote-admin.next-hop-only=true
; Enable this to use a different TLS only port for linking ONLY - no clients!
; This can improve security as link protocol is powerful!
;links.shared-listener=false
;links.listen=https://0.0.0.0:4421
;links.tls-cert=/etc/rustyrig/link-cert.pem
;links.tls-key=/etc/rustyrig/link-key.pem

; Server linking example: disabled until you configure and enable it.
; See doc/server-linking.md for listener/TLS setup and matching peer credentials.
; Use [peer:name] for additional peers. Links may form any tree.


; ==============================================
; Dedicated server-link listener access control
; ==============================================
;
; Only explicitly listed IPs/subnets may connect
; to the dedicated server-link port.
;
; Rules are processed in order; first match wins.
; Unmatched addresses are denied automatically.
;
; Use actual source IPs as seen by this server,
; including WireGuard tunnel IPs where applicable.

[acl:server-links]
; Localhost, useful for local testing
;allow=127.0.0.1/32
;allow=::1

; Home server (WireGuard)
;allow=10.8.0.237/32

; Camp server (WireGuard)
;allow=10.8.0.219/32

; Remote server (WireGuard)
;allow=10.8.0.187/32

; Example public IPv4 peer
;allow=198.51.100.25/32

; Example public IPv6 peer
;allow=2001:db8:1234::25/128

; Explicit fallback denial
deny=all

;[listener:link]
;acl=server-links

[peer]
enabled=false
autoconnect=false
; Incoming /link defaults to the ordinary client HTTP/HTTPS listeners.
; For a firewall-isolated server-link port, put these under [general]
; in rrserver.site-local.cfg:
; links.shared-listener=false
; links.listen=https://0.0.0.0:4421
; links.tls-cert=/etc/rustyrig/link-cert.pem
; links.tls-key=/etc/rustyrig/link-key.pem
; Restrict TCP/4421 to trusted peers; configure listener:link.acl too.
; Change the remote peer URL to wss://host:4421/link.
; /link shares the usual client ports: ws on 8420, wss on 4420.
; Plain ws requires links.allow-insecure=true under [general] on both servers.
server.url=wss://peer.example.net:4420/link
password=REPLACE-WITH-A-SHARED-LINK-PASSWORD
site.name=remote-site
acl=site
; Optional topology policy for this peer:
;leaf-only=true
;allowed-sites=remote-site remote-relay remote-leaf
;max-depth=2
; Unset inherits links.max-depth (default 5); 0 disables depth limits.
; leaf-only=true always overrides max-depth.
; max-depth counts hops beyond this direct peer: peer=0, child=1.
; A rejected subtree or introduction suspends automatic reconnect until /link open.
; Optional: pin the remote server's persistent UUID.
;node.uuid=
; For incoming-only operation, leave server.url empty.
