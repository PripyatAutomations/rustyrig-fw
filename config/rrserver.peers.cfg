; Server linking example: disabled until you configure and enable it.
; See doc/server-linking.md for listener/TLS setup and matching peer credentials.
; Use [peer:name] for additional peers. Links may form any tree.
[peer]
enabled=false
autoconnect=false
; /link shares the usual client ports: ws on 8420, wss on 4420.
; Plain ws requires links.allow-insecure=true under [general] on both servers.
server.url=wss://peer.example.net:4420/link
password=REPLACE-WITH-A-SHARED-LINK-PASSWORD
site.name=remote-site
acl=site
; Optional: pin the remote server's persistent UUID.
;node.uuid=
; For incoming-only operation, leave server.url empty.

