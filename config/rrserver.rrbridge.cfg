; Bridge receivers are opt-in; add hf-east to instances to enable this example.
; websdr.listen: configured bridges; websdr.connect: arbitrary temporary receivers.
; websdr.admin: receiver configuration administration. Grant through account privileges.
; Temporary rigs are removed after 60 seconds without listeners.
[general]
websdr.max-temporary = 8
websdr.idle-timeout = 60

[bridge]
instances =
path = auto
modules = auto

[bridge:hf-east]
enabled = true
driver = kiwi
host = receiver.example.net
port = 8073
rig = hf-east
;frequency = 14074000
;mode = USB
;password = optional-receiver-password
; Offline capability hints, superseded by live driver/receiver reports.
;rx-min-hz = 0
;rx-max-hz = 30000000
;rx-modes = USB LSB AM CW
;rx-audio = true
;rx-iq = false
;rx-waterfall = false
;tx-supported = false
;tx-min-hz = 0
;tx-max-hz = 0
;tx-modes =
;tx-audio = false
