; Recording applies only to raw audio record-sink branches.
jpeg.tx=v4l2src device=/dev/video0 ! videoconvert ! video/x-raw,width=640,height=480,framerate=15/1 ! jpegenc quality=70 ! appsink name=tx-sink emit-signals=false sync=false max-buffers=1 drop=true
jpeg.rx=appsrc name=rx-src is-live=true do-timestamp=true format=time caps=image/jpeg ! jpegparse ! jpegdec ! videoconvert ! video/x-raw,format=RGB ! pnmenc ! appsink name=rx-sink sync=false max-buffers=1 drop=true

