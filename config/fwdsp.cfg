[general]
log.file=./fwdsp.log



[pipeline]
pc16.rx=appsrc name=rx-src is-live=true format=bytes caps=audio/x-mulaw,rate=16000,channels=1 ! mulawdec ! audioconvert ! audio/x-raw,format=S16LE,rate=16000,channels=1 ! queue ! volume name=rx-vol ! pulsesink device=default name=rx-sink client-name=fwdsp-rx sync=false
pc16.tx=audiotestsrc is-live=true wave=sine freq=2600 do-timestamp=true ! audio/x-raw,format=S16LE,rate=16000,channels=1 ! mulawenc ! appsink name=tx-sink emit-signals=false sync=false max-buffers=2 drop=true
mu08.rx=appsrc name=rx-src is-live=true format=bytes caps=audio/x-mulaw,rate=8000,channels=1 ! mulawdec ! audioconvert ! queue ! volume name=rx-vol ! pulsesink device=default name=rx-sink client-name=fwdsp-rx sync=false
mu08.tx=audiotestsrc is-live=true wave=sine freq=1400 do-timestamp=true ! audio/x-raw,format=S16LE,rate=8000,channels=1 ! mulawenc ! appsink name=tx-sink emit-signals=false sync=false max-buffers=2 drop=true
mu16.tx=audiotestsrc is-live=true wave=sine freq=435 do-timestamp=1 ! audio/x-raw,rate=8000,channels=1 ! volume name=tx-vol ! appsink name=tx-sink emit-signals=true sync=false max-buffers=2 drop=true
; webcam capture: v4l2src frames -> jpeg. The 'device' property is
; replaced at spawn time by fwdsp_video_start() with webcam.device.
jpeg.tx=v4l2src device=/dev/video0 ! videoconvert ! video/x-raw,width=640,height=480,framerate=15/1 ! jpegenc quality=70 ! appsink name=tx-sink emit-signals=false sync=false max-buffers=2 drop=true
; webcam playback: incoming jpeg -> raw video for local render/decode.
jpeg.rx=appsrc name=rx-src do-timestamp=1 format=time ! jpegparse ! jpegdec ! videoconvert ! fakesink name=rx-sink sync=false
