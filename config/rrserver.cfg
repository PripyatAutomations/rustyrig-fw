/*
 * See rrserver/defconfig.c for options and their descriptions
 * Comments: // OR # OR ; OR /* */
 * most settings go in [general] setting, servers are called [server:name] where name is short name for it
 * If you need to send bug reports, please set log.level=*:crazy
 */
[general]
; Advertise tone (*T) and pink-noise (*P) codec variants for testing.
audio.test-mode=true
; Disable this if you don't like PTT being blocked at start
features.auto-block-ptt=true
; allow ws:// ports too
links.allow-insecure=true
pin.show=true
; Max days a password can age before warning
security.max-pw-age=90

# Add rig1 here after installing rustyrig-server-hamlib to enable the example.
rig.instances=rig0

codecs.allowed=opus pc16 g722 mu16 mu08 oggv aacv flac pc1T g72T mu1T mu0T opuT oggT aacT flaT pc1P g72P mu1P mu0P opuP oggP aacP flaP
codecs.allowed.video=h264 h265vp8 vp9 jpeg

core.tick-interval=100
log.file=/var/log/rustyrig/rrserver.log
;log.level=*:info,ws:crazy,ws.*:crazy,http.*:crazy,event:crazy,http.client:info,http.req:info,librrprotocol.*:crazy
;log.level=*:info,ws.msg.*:crazy,event:info,ws.chat.*:crazy
;log.level=*:info,ws.*:crazy,ws.proto:info,http.*:crazy,event.*:crazy,http.client:info,http.req:info,librrprotocol.*:crazy,db.*:crazy
;log.level=*:crazy,backend.*:info,ws.frame.*:info,vfo:info,auth.*:info
log.level=*:info,backend.*:debug

net.http.enabled=true
net.http.bind=0.0.0.0
net.http.tls-bind=0.0.0.0
net.http.port=8420
net.http.tls-port=4420
net.http.hex-dump=false
net.http.tls-enabled=false
net.http.tls-cert=/etc/rustyrig/cert.pem
net.http.tls-key=/etc/rustyrig/key.pem
net.http.ua-bans=/etc/rustyrig/ua-bans
net.http.www-root=/var/lib/rustyrig/www
net.mqtt-client.enabled=false
net.mqtt-client.port=8833

; XXX: Secret file will be replaced by a include soon!
net.mqtt-client.secret-file=/etc/rustyrig/mqtt-cli.secret
net.mqtt-client.host=ham-mqtt.local
net.mqtt-client.user=rustyrig

; Keep the broker listener local unless remote MQTT access is explicitly needed.
net.mqtt.enabled=false
net.mqtt.bind=127.0.0.1
net.mqtt.port=8833

