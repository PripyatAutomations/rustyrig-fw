; Symbolic serial bindings.  Raw exports require serial or serial.<portname>
; account privileges. Admin/owner alone do not grant device access.
; See doc/serial-interfaces.md for privileges and mesh limitations.
; No physical device opens until an authorized client attaches.
[serial]
;ttyHOST0=serial:/dev/ttyUSB0@115200,8n1
;ttyGPS0=station.gps-in@4800
;ttyGPS1=rig1.gps-in@4800
;ttyGPS2=rig0.gps-out@4800

; GPS endpoints default to PTYs at $HOME/dev/<name>. Real receiver example:
;[serial:ttyGPS0]
;type=serial
;path=/dev/ttyUSB1
;[serial:ttyHOST0]
;buffer-bytes=16384
; Privileges are assigned to accounts, NOT via a per-export access= key.
; Grant serial.ttyHOST0 to the appropriate account on this server.
