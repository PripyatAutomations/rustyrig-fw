; Symbolic serial bindings.  Raw exports require serial or serial.<portname>
; account flags (admin|owner by default).  No device opens until an
; authorized client attaches.
[serial]
;ttyHOST0=serial:/dev/ttyUSB0@115200,8n1
;ttyGPS0=station.gps-in@4800
;ttyGPS1=rig1.gps-in@4800
;ttyGPS2=rig0.gps-out@4800

; Modem executable directory (rrserver defconfig: /var/lib/rustyrig/modems)
;modem.path=/var/lib/rustyrig/modems
; -------- Experimental DSP modem workers (optional; disabled by default) --------
; External worker processes live on rrserver alongside their owning rig.
; See doc/dsp-workers.md and doc/TODO-MODEM for the full design/roadmap.
; This is the currently available serial subprocess bridge, NOT an RF TX modem.
; Example ONLY: create/install the executable yourself before enabling.
;ttyMODEM0=modem:/var/lib/rustyrig/modems/rrmodem-ft8
; First experimental receive-only FT8 worker (optional; see modems/ft8/README.md).
; Build it independently using kgoba/ft8_lib, then configure an absolute path:
;ttyMODEM0=modem:/var/lib/rustyrig/modems/rrmodem-ft8
;[serial:ttyMODEM0]
;rig=rig0
; Default output: FT8 decode JSON lines; send RAW followed by newline for plain text.
; Send JSON followed by newline to restore JSON lines. TX is NOT supported.

;ttyMODEM1=modem:/usr/local/libexec/rustyrig/modem-worker --profile psk31
;
;[serial:ttyMODEM0]
;rig=rig0                     ; feed receive PCM from local rig0
;log=/var/log/rustyrig/ttyMODEM0.log  ; optional binary-safe hex serial traffic
;buffer-bytes=16384
; Notes: log directory must exist and be writable by rrserver; rotate logs.
; Log rows: unix_seconds TAB username TAB session_fingerprint TAB TX|RX TAB hex
; This fingerprint is NOT a bearer/session authentication token.
; Worker child FD layout: 0/1 application serial bytes, 2 stderr,
; 3 SOCK_SEQPACKET control, 4 rig RX PCM input, 5 rig TX PCM output.
; RX PCM has initial best-effort nonblocking wiring. Control, PTT leases,
; TX injection and negotiated PCM/packet framing are NOT implemented yet.
; Future: permanent per-VFO decoders, auto-start on audio source availability,
; SDR slices and independent FT8/other-band decoding (January 2027 target).


; GPS endpoints default to PTYs at ./dev/<name>. Real receiver example:
;[serial:ttyGPS0]
;type=serial
;path=/dev/ttyUSB1
;[serial:ttyHOST0]
;buffer-bytes=16384
;access=admin|owner
