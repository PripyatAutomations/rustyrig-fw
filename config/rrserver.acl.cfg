; Ordered named ACLs: first match wins; an unmatched or empty policy denies.
; Place specific denies before broader allows. "all" explicitly matches anyone.
[acl:site]
allow=127.0.0.0/8
allow=::1
allow=10.0.0.0/8
allow=172.16.0.0/12
allow=192.168.0.0/16

[listener:http]
acl=site
[listener:https]
acl=site
[listener:link]
acl=site
[listener:mqtt]
acl=site
[listener:media]
acl=site
