; Standalone callsign-lookup configuration.
; Installed as /etc/rustyrig/callsign-lookup.cfg or ~/.config/callsign-lookup.cfg.
[callsign-lookup]
use-qrz=true
use-uls=false
qrz-api-url=https://xmldata.qrz.com/xml/1.34/
qrz-username=YOUR_CALLSIGN
qrz-password=YOUR_QRZ_PASSWORD_OR_API_KEY
use-cache=true
cache-db=./db/callsigns.db
cache-expiry=3d
cache-keep-stale-if-offline=true
path=/usr/bin/callsign-lookup

; Optional station location used for distance/bearing calculations.
; [site]
; coordinates=40.7128,-74.0060
; gridsquare=FN30as
