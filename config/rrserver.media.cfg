[general]
; Direct audio: advertise a hostname/IP reachable by native clients.
; Leave media.direct.host empty to use WebSocket audio only.
media.direct.enabled=true
media.direct.bind=0.0.0.0
media.direct.port=8422
media.direct.host=
; Encryption requires a build with WITH_RTP_ENCRYPTION=true.
media.direct.encrypt=false
