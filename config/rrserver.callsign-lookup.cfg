; Copy to /etc/rustyrig/callsign-lookup.srv.cfg and replace the credentials.
[callsign-lookup]
; Set to true and set credentials below to use QRZ
use-qrz=false
use-uls=false
use-cache=true
qrz-api-url=https://xmldata.qrz.com/xml/1.34/
qrz-username=YOUR_CALLSIGN
qrz-password=YOUR_QRZ_PASSWORD_OR_API_KEY
cache-db=/var/lib/rustyrig/db/rrserver-callsigns.db
cache-expiry=3d
cache-keep-stale-if-offline=true
path=/usr/bin/callsign-lookup
