;
; Put your server-local stuff here (site id, coordinates, etc)
;
[general]
rig.identity-namespace=rplywv00
owner.call=N0CALL
owner.privs=US/General
pin.master=012345
pin.reset=76543210
station.call=N0CALL
station.grid=AA00aa
; Site lobby is #<name>; rig rooms default to #<name>-<rig alias>.
; Domain is configured in rrserver.cfg. Override it here only if needed,
; removing or changing the setting in rrserver.cfg to avoid ambiguity.
;domain=camp.local
station.name=rplywv00
; Public server metadata propagated over linked site catalog and shown to clients.
; Location format: City, State, Country (MOBILE for mobile rigs).
station.description=A misconfigured server
station.location=Unknown City
; Optional station coordinates; inherited by rigs without their own position.
; Fixed coordinates disable the live station GPS receiver adapters.
;station.gps.position=38.1234567,-80.7654321
