name: C/C++ CI

on:
  push:
    branches: [ "main", "mesh-linking" ]
  pull_request:
    branches: [ "main" ]

# New commits supersede old checks on the same PR or push branch.
# This prevents bursts of redundant CI jobs and failure notifications.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: debian-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: configure
      run: make buildconf PROFILE=radio
    - name: make
      run: make PROFILE=radio
    - name: test
      run: make test PROFILE=radio
