name: C/C++ CI

# Temporarily disabled: do not run CI automatically on pushes or PRs.
# Re-enable push/pull_request triggers when the build is repaired.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: debian-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: configure
      run: make buildconf PROFILE=radio
    - name: make
      run: make PROFILE=radio
    - name: test
      run: make test PROFILE=radio
