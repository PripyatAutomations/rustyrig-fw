name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: debian-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: configure
      run: make buildconf PROFILE=radio
    - name: make
      run: make PROFILE=radio
    - name: test
      run: make test PROFILE=radio
