name: Native KiwiSDR bridge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kiwi-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install C toolchain and bridge SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 make pkg-config jq libglib2.0-dev libbsd-dev libcrypt-dev libncurses-dev libssl-dev libwslay-dev libcurl4-openssl-dev libsqlite3-dev libsrtp2-dev libev-dev libjson-perl libmojolicious-perl libhash-merge-perl libjson-xs-perl libstring-crc32-perl libjson-validator-perl libterm-readline-perl-perl
      - name: Build and install standalone RustyAxe
        run: |
          make -C librustyaxe -j2 CC=clang-18 WITH_MONGOOSE=false
          sudo make -C librustyaxe CC=clang-18 WITH_MONGOOSE=false PREFIX=/usr install
          sudo ldconfig
      - name: Build and install standalone wire protocol
        run: |
          make -C librrprotocol -j2 CC=clang-18
          sudo make -C librrprotocol CC=clang-18 PREFIX=/usr install
          sudo ldconfig
      - name: Build only native bridge and Kiwi plugin
        run: |
          make -j2 PROFILE=rrserver CC=clang-18 WITH_HAMLIB=no LIBRUSTYAXE_PROVIDER=system LIBRRPROTOCOL_PROVIDER=system LIBRUSTYIRC_PROVIDER=system bin/rrbridge bin/rrbridge-kiwi.so
      - name: Run Kiwi protocol regression and Mongoose boundary test
        run: |
          make PROFILE=rrserver CC=clang-18 WITH_HAMLIB=no LIBRUSTYAXE_PROVIDER=system LIBRRPROTOCOL_PROVIDER=system LIBRUSTYIRC_PROVIDER=system test-rrbridge-kiwi check-rrbridge-native
