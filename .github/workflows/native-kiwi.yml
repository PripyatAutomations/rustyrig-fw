name: Native KiwiSDR bridge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kiwi-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install C toolchain and bridge SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 make pkg-config jq libglib2.0-dev libbsd-dev libcrypt-dev libncurses-dev libssl-dev libwslay-dev libcurl4-openssl-dev libsqlite3-dev libsrtp2-dev libev-dev libjson-perl libmojolicious-perl libhash-merge-perl libjson-xs-perl libstring-crc32-perl libjson-validator-perl libterm-readline-perl-perl
      - name: Install independently maintained libraries
        run: |
          git clone --depth=1 https://github.com/PripyatAutomations/librustyaxe.git /tmp/rustyrig-librustyaxe
          make -C /tmp/rustyrig-librustyaxe -j2 CC=clang-18 WITH_MONGOOSE=false
          sudo make -C /tmp/rustyrig-librustyaxe CC=clang-18 WITH_MONGOOSE=false PREFIX=/usr install
          git clone --depth=1 https://github.com/PripyatAutomations/librrprotocol.git /tmp/rustyrig-librrprotocol
          make -C /tmp/rustyrig-librrprotocol -j2 CC=clang-18
          sudo make -C /tmp/rustyrig-librrprotocol CC=clang-18 PREFIX=/usr install
          sudo ldconfig
      - name: Build only native bridge and Kiwi plugin
        run: |
          make -j2 PROFILE=rrserver CC=clang-18 WITH_HAMLIB=no bin/rrbridge bin/rrbridge-kiwi.so
      - name: Run Kiwi protocol regression and Mongoose boundary test
        run: |
          make PROFILE=rrserver CC=clang-18 WITH_HAMLIB=no test-rrbridge-kiwi check-rrbridge-native
