# Merge into the existing rrserver config on rplywv00.
[general]
station.name=rplywv00
links.listen=https://0.0.0.0:8443
links.tls-cert=/etc/rustyrig/link-cert.pem
links.tls-key=/etc/rustyrig/link-key.pem
links.tls-ca=/etc/rustyrig/link-ca.pem

[peer]
enabled=true
autoconnect=true
server.url=wss://nycvny37.example.net:8443/link
username=station-link
password=REPLACE-WITH-THE-SAME-RANDOM-LINK-PASSWORD-ON-BOTH-SERVERS
site.name=nycvny37
# The remote server is a child of this root.
role=child
# Optional: pin the remote UUID printed by its startup log.
# node.uuid=...
